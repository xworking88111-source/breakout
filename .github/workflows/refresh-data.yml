name: Refresh data snapshot

# 每週一自動重抓 AniList 公開資料並重建資料集；公開 repo 的 Actions 免費。
# Weekly refresh of the public AniList snapshot; Actions minutes are free for public repos.
# 沒有金鑰、沒有付費 API：只用 AniList 公開 GraphQL 端點。
# No keys, no paid APIs: only the public AniList GraphQL endpoint.

on:
  schedule:
    - cron: '0 2 * * 1' # 每週一 02:00 UTC = 台北時間週一 10:00 / Mondays 10:00 Asia/Taipei
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch AniList snapshot
        run: node scripts/fetch_anilist.mjs

      - name: Rebuild dataset
        run: node scripts/build_dataset.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- app/src/data anime.json; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/data/anime.json app/src/data/works.json
          git commit -m "chore(data): weekly snapshot $(date -u +%Y-%m-%d)"
          git push
